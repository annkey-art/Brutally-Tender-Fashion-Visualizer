name: Update Fashion Catalog
'on':
  push:
    branches: [main]
    paths:
      - 'gallery/overlays/**'
  workflow_dispatch: {}
permissions:
  contents: write
jobs:
  rebuild-fashion-catalog:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Scan five clothing categories
        shell: python
        run: |
          import json
          from pathlib import Path
          categories = ['Dress', 'Shirt', 'Trousers', 'Skirt', 'Jacket']
          allowed = {'.png', '.webp'}
          catalog = {}
          for cat in categories:
              folder = Path('gallery/overlays') / cat
              catalog[cat] = [
                  file.as_posix() for file in sorted(folder.iterdir(), key=lambda p: p.name.lower())
                  if file.is_file() and file.suffix.lower() in allowed
              ] if folder.is_dir() else []
          Path('fashion-data.js').write_text(
              'const fashionCatalog = ' + json.dumps(catalog, indent=2) + ';\n',
              encoding='utf-8'
          )
      - name: Commit regenerated catalog if changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add fashion-data.js
          if ! git diff --cached --quiet; then
            git commit -m "Update fashion overlay catalog"
            git push
          fi
